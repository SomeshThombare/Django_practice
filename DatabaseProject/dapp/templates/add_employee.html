{% extends 'base.html' %} {% block body %}

<title>{% block title %}Add Employee{% endblock %}</title>

<h2>Add New Employee</h2>

<!-- The method must be POST to match request.method == "POST" -->
<form method="POST">
  <!-- Django requires the CSRF token for POST forms -->
  {% csrf_token %}

  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label for="emp_name">Employee Name</label>
      <input
        type="text"
        class="form-control"
        name="emp_name"
        id="emp_name"
      />
    </div>

    <div class="form-group">
      <label for="emp_age">Age</label>
      <input type="number" class="form-control" id="emp_age" name="emp_age"  value="emp_age"/>
    </div>

    <div class="form-group">
      <label for="emp_salary">Salary</label>
      <input
        type="number"
        class="form-control"
        name="emp_salary"
        id="emp_salary"
        value="emp_salary"
      />
    </div>
    <button type="submit" class="btn btn-primary">Save Emplooyee</button>
  </form>
  {% endblock %}
</form>
