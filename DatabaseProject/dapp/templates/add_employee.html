{% extends 'base.html' %} 

{% block title %}Add Employee{% endblock %}

{% block body %}
<h2>Add New Employee</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-group">
        <label for="emp_name">Employee Name</label>
        <input type="text" class="form-control" name="emp_name" id="emp_name" required />
    </div>

    <div class="form-group">
        <label for="emp_age">Age</label>
        <!-- FIX 2: Removed value="emp_age" because it inserts literal text into a number input -->
        <input type="number" class="form-control" id="emp_age" name="emp_age" required />
    </div>

    <div class="form-group">
        <label for="emp_salary">Salary</label>
        <input type="number" class="form-control" name="emp_salary" id="emp_salary" required />
    </div>

    <div class="form-group">
        <label for="employeeImage">Photo</label>
        <input type="file" class="form-control" id="employeeImage" name="emp_image"/>
    </div>

    <button type="submit" class="btn btn-primary">Save Employee</button>
</form>
{% endblock %}
