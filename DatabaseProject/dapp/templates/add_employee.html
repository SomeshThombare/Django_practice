<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
</head>
<body>

    <h2>Add New Employee</h2>
    
    <!-- The method must be POST to match request.method == "POST" -->
    <form method="POST">
        <!-- Django requires the CSRF token for POST forms -->
        {% csrf_token %}
        
        <!-- The 'name' attributes must match the backend keys exactly -->
        <div>
            <label for="emp_name">Employee Name:</label>
            <input type="text" id="emp_name" name="emp_name" required>
        </div>
        <br>
        
        <div>
            <label for="emp_age">Age:</label>
            <input type="number" id="emp_age" name="emp_age" required>
        </div>
        <br>
        
        <div>
            <label for="emp_salary">Salary:</label>
            <input type="number" id="emp_salary" name="emp_salary" step="0.01" required>
        </div>
        <br>
        
        <button type="submit">Save Employee</button>
    </form>

</body>
</html>
