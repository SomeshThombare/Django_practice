{% extends 'base.html' %}

<title>{% block title %}Update Employee Details{% endblock %}</title>
{% block body %}
    <h1>Update Employee Data</h1>

    <form method="POST" >
        {% csrf_token %}
         
       <div class="form-group">
      <label for="emp_name">Employee Name</label>
      <input
        type="text"
        class="form-control"
        name="emp_name"
        id="emp_name"
        value="{{ obj.name }}"
      />
    </div>

    <div class="form-group">
      <label for="emp_age">Age</label>
      <input type="number" class="form-control" id="emp_age" name="emp_age"  value="{{ obj.age }}"/>
    </div>

    <div class="form-group">
      <label for="emp_salary">Salary</label>
      <input
        type="number"
        class="form-control"
        name="emp_salary"
        id="emp_salary"
        value="{{obj.salary}}"
      />
    </div>

        <button type="submit" class="btn btn-success">Update Details</button></button>

        <a href="/list/"><button type="button" class="btn btn-warning">Cancle</button></a>
    </form>

{% endblock %}
