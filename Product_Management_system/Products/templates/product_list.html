{% extends 'base.html' %}

{% block title %}Product List{% endblock %}

{% block body %}
<div class="container mt-4">
    <h3>Products List</h3>
    
    {% for p in data %}
        <div class="product-item border-bottom pb-3 mb-3">
           <p>Name :<a href="/detail/{{ p.id }}/">{{ p.name }}</a></p> 
           
        </div>
    {% empty %}
        <p>No products found in the database.</p>
    {% endfor %}
</div>
{% endblock %}
